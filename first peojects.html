<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mera pehla web project">
  <title>Mera Pehla Project</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2ff; color: #1f2937; }
    main { max-width: 800px; margin: 50px auto; padding: 32px; background: white; border-radius: 16px; text-align: center; }
    main { box-shadow: 0 8px 24px #0002; }
    h1 { color: #4f46e5; }
    h2 { color: #3730a3; }
    p { line-height: 1.6; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 28px 0; }
    .feature { padding: 18px; background: #f3f4f6; border-radius: 10px; }
    a { display: inline-block; padding: 12px 22px; color: white; background: #4f46e5; border-radius: 8px; text-decoration: none; }
    a { transition: background 0.2s; }
    a:hover { background: #3730a3; }
    @media (max-width: 600px) {
      main { margin: 20px; padding: 24px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Namaste!</h1>
  <p>Yeh mera pehla web project hai. Is page par aapka swagat hai.</p>
  <p>Yahan main apne naye ideas aur projects share karunga.</p>
  <div class="features">
    <section class="feature">
      <h2>Seekho</h2>
      <p>Nayi skills seekhein.</p>
    </section>
    <section class="feature">
      <h2>Banao</h2>
      <p>Apne ideas ko sach karein.</p>
    </section>
    <section class="feature">
      <h2>Share</h2>
      <p>Apna kaam sabke saath baantein.</p>
    </section>
  </div>
  <a href="mailto:hello@example.com">Mujhse sampark karein</a>
  <footer><p>Dhanyavaad, visit karne ke liye!</p></footer>
</main>
</body>
</html>
